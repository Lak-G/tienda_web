# /etc/nginx/conf.d/tiendanube.conf — proxy inverso hacia Kestrel (solo escucha en 127.0.0.1:5000)
# default_server: el nginx.conf de Amazon Linux trae otro server en :80 con server_name _;
# así este atiende cualquier Host sin depender del orden de los include
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Imagen de hasta 2 MB más el resto del formulario; igual al límite de FormOptions en Program.cs
    client_max_body_size 3M;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
